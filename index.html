<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nousagi Wiki · Bách khoa Nousagi Arena</title>
<meta name="description" content="Wiki chính thức của bot Discord Nousagi Huang: lệnh, sinh vật, vũ khí, Ấn Ký, ngọc, Raid, Thần Thú Bạch Hổ.">
<meta name="theme-color" content="#0b0a12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===================== NỀN TẢNG ===================== */
:root{
  --bg:#0b0a12;--bg2:#100e19;--panel:#151320;--panel2:#1b1829;--line:#2a2540;--line2:#3a3356;
  --txt:#eeeaf8;--mut:#9d96b8;--dim:#6f6889;
  --gold:#ffc24a;--gold2:#ff9d2e;--crim:#ff3d6e;--vio:#8b5cf6;--cyan:#38d9f5;
  --rc:#b4b4c2;--ru:#4ade80;--rr:#60a5fa;--re:#c084fc;--rl:#fbbf24;--rm:#ff4d6d;--rf:#7dd3fc;--rs:#f472b6;
  --fire:#ff7a3d;--water:#3db5ff;--wood:#4fd17a;--thunder:#ffd23d;--dark:#a77bff;
  --r:14px;--side:268px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font:15px/1.65 "Be Vietnam Pro",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 85% -10%,rgba(255,61,110,.13),transparent 60%),
             radial-gradient(800px 600px at -10% 30%,rgba(139,92,246,.10),transparent 60%),
             radial-gradient(600px 400px at 50% 110%,rgba(255,194,74,.07),transparent 60%)}
a{color:var(--cyan);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
code,.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
code{background:#221d36;color:#ffb8cb;padding:1px 7px;border-radius:6px;font-size:.86em;white-space:nowrap}
img.ei{width:1.35em;height:1.35em;object-fit:contain;vertical-align:-.3em;display:inline-block}
.fb{display:inline-block;width:1.35em;text-align:center}

/* ===================== THANH TRÊN ===================== */
.top{position:sticky;top:0;z-index:50;height:62px;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:rgba(11,10,18,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.burger{width:40px;height:40px;border-radius:10px;display:none;place-items:center;background:var(--panel)}
.burger span,.burger span::before,.burger span::after{display:block;width:18px;height:2px;background:var(--txt);border-radius:2px;position:relative}
.burger span::before,.burger span::after{content:"";position:absolute;left:0}
.burger span::before{top:-6px}.burger span::after{top:6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.5px;white-space:nowrap}
.logo .mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,#2a1230,#1a1030);border:1px solid #5a2c4f;box-shadow:0 0 18px rgba(255,61,110,.35)}
.logo b{background:linear-gradient(90deg,var(--gold),var(--crim));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:19px}
.logo small{display:block;font-size:10px;color:var(--mut);font-weight:600;letter-spacing:2.5px;margin-top:-4px}
.search{flex:1;max-width:520px;margin-left:auto;position:relative}
.search input{width:100%;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--panel);
  color:var(--txt);padding:0 14px 0 38px;font:inherit;font-size:14px;outline:none;transition:.2s}
.search input:focus{border-color:var(--vio);box-shadow:0 0 0 3px rgba(139,92,246,.2)}
.search svg{position:absolute;left:12px;top:11px;opacity:.6}
.sres{position:absolute;top:46px;left:0;right:0;background:var(--panel);border:1px solid var(--line2);border-radius:12px;
  max-height:60vh;overflow:auto;display:none;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sres.on{display:block}
.sres a{display:flex;gap:10px;align-items:center;padding:10px 14px;color:var(--txt);border-bottom:1px solid var(--line)}
.sres a:hover,.sres a.hl{background:var(--panel2)}
.sres a small{color:var(--mut);margin-left:auto;font-size:12px;white-space:nowrap}
.sres .none{padding:14px;color:var(--mut)}
.invite{height:40px;padding:0 16px;border-radius:11px;font-weight:700;font-size:14px;color:#fff;display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,var(--crim),var(--vio));box-shadow:0 6px 22px rgba(255,61,110,.3);white-space:nowrap}

/* ===================== BỐ CỤC ===================== */
.wrap{display:flex;position:relative;z-index:1}
.side{position:sticky;top:62px;height:calc(100vh - 62px);width:var(--side);flex:none;overflow:auto;padding:16px 12px 40px;
  border-right:1px solid var(--line);background:rgba(16,14,25,.6)}
.side h6{font-size:11px;letter-spacing:2px;color:var(--dim);font-weight:800;margin:18px 10px 6px;text-transform:uppercase}
.side h6:first-child{margin-top:4px}
.side a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:#cdc7e2;font-size:14px;font-weight:500;transition:.15s}
.side a:hover{background:var(--panel);color:#fff}
.side a.on{background:linear-gradient(90deg,rgba(255,61,110,.18),rgba(139,92,246,.10));color:#fff;box-shadow:inset 3px 0 0 var(--crim)}
.side a .ei,.side a .fb{font-size:16px}
.main{flex:1;min-width:0;padding:26px 34px 60px;max-width:1180px}
.scrim{display:none}

/* ===================== THÀNH PHẦN ===================== */
.crumb{font-size:12px;color:var(--mut);margin-bottom:6px;letter-spacing:.3px}
.crumb a{color:var(--mut)}
h1.pt{font-size:clamp(26px,4.4vw,38px);font-weight:900;line-height:1.15;letter-spacing:-.5px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1.pt .ei{width:42px;height:42px}
.lead{color:#c4bedb;font-size:16px;margin:10px 0 22px;max-width:780px}
h2{font-size:21px;font-weight:800;margin:34px 0 12px;display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
h2::before{content:"";width:6px;height:20px;border-radius:3px;background:linear-gradient(var(--gold),var(--crim))}
h3{font-size:16px;font-weight:700;margin:18px 0 8px}
p{margin:6px 0}
.mut{color:var(--mut)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grid.g3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.card h4{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card p{color:var(--mut);font-size:14px}
a.card{color:inherit;transition:.18s}
a.card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11.5px;font-weight:700;background:#241f39;color:#cfc8ea}
.note{border:1px solid #4a3a1a;background:linear-gradient(90deg,rgba(255,194,74,.10),transparent);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:14px}
.note.v{border-color:#3d2f6b;background:linear-gradient(90deg,rgba(139,92,246,.12),transparent)}
.note.r{border-color:#5a2236;background:linear-gradient(90deg,rgba(255,61,110,.12),transparent)}
ul.li{padding-left:20px;margin:6px 0}ul.li li{margin:4px 0}
.c-c{color:var(--rc)}.c-u{color:var(--ru)}.c-r{color:var(--rr)}.c-e{color:var(--re)}.c-l{color:var(--rl)}.c-m{color:var(--rm)}.c-f{color:var(--rf)}.c-s{color:var(--rs)}
.c-l,.c-m{text-shadow:0 0 12px currentColor}
.el-fire{color:var(--fire)}.el-water{color:var(--water)}.el-wood{color:var(--wood)}.el-thunder{color:var(--thunder)}.el-dark{color:var(--dark)}

/* Bảng */
.tbl{width:100%;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{position:sticky;top:0;background:#1e1a2e;text-align:left;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:#bdb6d6;
  padding:10px 12px;font-weight:800;white-space:nowrap;user-select:none}
th.s{cursor:pointer}th.s:hover{color:#fff}
th.s::after{content:" ⇅";opacity:.35}th.asc::after{content:" ▲";opacity:1;color:var(--gold)}th.desc::after{content:" ▼";opacity:1;color:var(--gold)}
td{padding:9px 12px;border-top:1px solid var(--line);white-space:nowrap}
tbody tr{transition:.12s}
tbody tr:hover{background:#1f1b30}
tr.click{cursor:pointer}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:4px;background:#26213a;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:4px}

/* Bộ lọc */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 14px}
.chip{padding:6px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;color:#cfc8ea;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.chip:hover{border-color:var(--line2)}
.chip.on{background:linear-gradient(135deg,rgba(255,61,110,.25),rgba(139,92,246,.25));border-color:#6b4bb8;color:#fff}
.fin{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--txt);padding:0 12px;font:inherit;font-size:14px;outline:none}
.fin:focus{border-color:var(--vio)}
input[type=range]{accent-color:var(--crim);width:180px}
.lvl{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 12px;font-size:13px;font-weight:600}
.lvl b{color:var(--gold);min-width:26px;display:inline-block}

/* HERO trang chủ */
.hero{position:relative;border-radius:22px;padding:42px 34px;overflow:hidden;border:1px solid #3b2650;
  background:radial-gradient(700px 300px at 85% 20%,rgba(255,61,110,.28),transparent 60%),
             radial-gradient(600px 300px at 10% 100%,rgba(139,92,246,.30),transparent 60%),linear-gradient(135deg,#1a1028,#0f0c1a)}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:36px 36px;mask:linear-gradient(180deg,#000,transparent 85%)}
.hero>*{position:relative;z-index:1}
.hero .kick{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:800;letter-spacing:2px;color:var(--gold);
  border:1px solid #5d4720;background:rgba(255,194,74,.08);padding:4px 12px;border-radius:999px}
.hero h1{font-size:clamp(34px,7vw,64px);font-weight:900;line-height:1.02;letter-spacing:-1.5px;margin:14px 0 12px}
.hero h1 span{background:linear-gradient(90deg,var(--gold) 0%,var(--crim) 55%,var(--vio) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#d3cde8;font-size:16.5px;max-width:600px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;font-weight:700;font-size:15px;color:#fff;
  background:linear-gradient(135deg,var(--crim),var(--vio));box-shadow:0 8px 28px rgba(255,61,110,.35)}
.btn.gh{background:rgba(255,255,255,.06);border:1px solid var(--line2);box-shadow:none}
.hero .pets{position:absolute;right:26px;top:30px;display:grid;grid-template-columns:repeat(3,58px);gap:10px;z-index:1}
.hero .pets div{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:28px;animation:float 4s ease-in-out infinite}
.hero .pets div:nth-child(2n){animation-delay:-2s}.hero .pets div:nth-child(3n){animation-delay:-1s}
.hero .pets .ei{width:40px;height:40px}
@keyframes float{50%{transform:translateY(-6px)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0 6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{font-size:26px;font-weight:900;display:block;line-height:1.1;background:linear-gradient(90deg,#fff,#c9b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12.5px;color:var(--mut);font-weight:600}
.diff{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.diff .card{padding:18px}
.diff .card .ic{font-size:26px;margin-bottom:8px;display:block}
.diff .card .ic .ei{width:34px;height:34px}

/* Lệnh */
.cmds{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.cmd{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 14px;display:flex;flex-direction:column;gap:6px;transition:.15s}
.cmd:hover{border-color:var(--line2)}
.cmd .hd{display:flex;align-items:center;gap:8px}
.cmd .nm{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:15px;color:#fff}
.cmd .grp{margin-left:auto}
.cmd .ds{color:#c5bfdc;font-size:13.5px}
.cmd .us{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:#ffb8cb;background:#1d1830;border-radius:8px;padding:6px 9px;overflow-x:auto;white-space:nowrap}
.cmd .ft{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mut)}
.cp{margin-left:auto;font-size:12px;font-weight:700;padding:4px 10px;border-radius:7px;background:#2a2442;color:#e6e0ff}
.cp:hover{background:#3a3260}
.pfx{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pfx button{padding:7px 14px;font-weight:700;font-size:13px;font-family:"JetBrains Mono",monospace}
.pfx button.on{background:var(--crim);color:#fff}

/* Hệ nguyên tố */
.cycle{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:22px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel)}
.el{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:78px;padding:12px 10px;border-radius:14px;background:#1d1930;border:1px solid currentColor;font-weight:800;font-size:14px}
.el .ei,.el .fb{width:34px;height:34px;font-size:28px}
.arw{color:var(--dim);font-size:22px;font-weight:900}

/* Modal */
.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:16px;background:rgba(5,4,10,.72);backdrop-filter:blur(6px)}
.modal.on{display:grid}
.mbox{width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:20px;border:1px solid var(--line2);background:linear-gradient(180deg,#1b1729,#121019);box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .22s ease}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.mhead{padding:22px;display:flex;gap:16px;align-items:center;position:relative}
.mhead .big{width:84px;height:84px;border-radius:22px;display:grid;place-items:center;font-size:46px;background:#211c35;border:1px solid currentColor;box-shadow:0 0 30px -6px currentColor;flex:none}
.mhead .big .ei{width:62px;height:62px}
.mhead h3{margin:0;font-size:22px;font-weight:900;color:#fff}
.mx{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;background:#2a2442;font-size:18px}
.mbody{padding:0 22px 22px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.kv div{background:#1d1930;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.kv small{display:block;color:var(--mut);font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.kv b{font-size:17px}

/* Vũ khí */
.wcard{display:flex;flex-direction:column;gap:8px}
.wcard .top2{display:flex;gap:12px;align-items:center}
.wico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;background:#211c35;border:1px solid var(--line2);flex:none}
.wico .ei{width:38px;height:38px}
.ult{border-top:1px dashed var(--line2);padding-top:8px;font-size:13.5px;color:#d8d2ee}
.ult b{color:var(--gold)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.calc label{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:6px}
.calc select{width:100%}
.out{grid-column:1/-1;background:#1d1830;border:1px solid var(--line2);border-radius:12px;padding:14px}
.out .v{font-size:28px;font-weight:900;color:var(--gold)}

/* Bạch Hổ */
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.form{text-align:center;padding:14px}
.form img{width:120px;height:120px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 0 16px rgba(255,210,61,.35))}
.form b{display:block;font-size:15px}

/* Điểm danh */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:12.5px}
.day b{display:block;font-size:13px;color:var(--gold);margin-bottom:4px}
.day.big{border-color:#7a5a1d;background:linear-gradient(180deg,rgba(255,194,74,.16),var(--panel));box-shadow:0 0 22px -8px var(--gold)}

/* Trang trí */
.cos{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cos .sw{height:92px;border-radius:12px;margin-bottom:10px;position:relative;overflow:hidden}
.cos .fr{height:92px;border-radius:12px;margin-bottom:10px;display:grid;place-items:center;background:#1a1628}
.cos .fr i{width:64px;height:64px;border-radius:16px;border:4px solid;display:block;background:#241f39}

/* Navbox cuối trang */
.navbox{margin-top:50px;border:1px solid var(--line2);border-radius:16px;overflow:hidden;background:var(--panel)}
.navbox .nh{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;font-weight:800;background:#1e1a2e;border-bottom:1px solid var(--line)}
.navbox .row{display:grid;grid-template-columns:170px 1fr;border-top:1px solid var(--line)}
.navbox .row:first-of-type{border-top:0}
.navbox .rk{padding:10px 14px;font-weight:800;font-size:14px;background:#191628;display:flex;align-items:center;gap:8px}
.navbox .rv{padding:10px 14px;font-size:14px;line-height:1.9}
.navbox .rv a+a::before{content:" • ";color:var(--dim)}
footer{color:var(--dim);font-size:13px;text-align:center;margin-top:26px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#2a2442;border:1px solid var(--line2);padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:200;transition:.25s;opacity:0}
.toast.on{transform:translateX(-50%);opacity:1}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* ===================== ĐIỆN THOẠI ===================== */
@media(max-width:920px){
  .burger{display:grid}
  .side{position:fixed;left:0;top:62px;z-index:60;transform:translateX(-105%);transition:.25s;background:#0f0d18;width:282px;box-shadow:20px 0 60px rgba(0,0,0,.5)}
  body.nav .side{transform:none}
  body.nav .scrim{display:block;position:fixed;inset:62px 0 0;z-index:55;background:rgba(0,0,0,.55)}
  .main{padding:18px 14px 50px}
  .logo small{display:none}
  .invite span{display:none}
  .invite{padding:0 12px}
  .hero{padding:28px 20px}
  .hero .pets{position:static;margin-top:22px;grid-template-columns:repeat(6,1fr)}
  .hero .pets div{width:auto;aspect-ratio:1}
  .cmds{grid-template-columns:1fr}
  .navbox .row{grid-template-columns:1fr}
  .days{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:560px){
  .logo b{font-size:16px}
  .search input::placeholder{font-size:13px}

    rows.sort((a,b)=>{const A=sk==="r"?ORDER.indexOf(a.p.r)*100+ +a.p.cid[1]:sk==="el"?a.p.el:a[sk],B=sk==="r"?ORDER.indexOf(b.p.r)*100+ +b.p.cid[1]:sk==="el"?b.p.el:b[sk];return (A>B?1:A<B?-1:0)*dir;});
    const mx = Math.max(...rows.map(r=>r.pw),1);
    $("#pt").innerHTML = rows.map(r=>`<tr class="click" data-c="${r.p.cid}">
      <td>${pIcon(r.p)} <b>${r.p.name}</b></td><td>${rp(r.p.r)}</td><td>${ep(r.p.el)}</td>
      <td class="n">${fmt(r.hp)}</td><td class="n">${fmt(r.atk)}</td><td class="n">${fmt(r.df)}</td><td class="n">${r.spd}</td>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:${100*r.pw/mx}%;background:var(--r${r.p.r})"></i></div><span class="mono" style="font-size:12px">${fmt(r.pw)}</span></div></td>
      <td class="n">${I("coin")} ${fmt(r.sell)}</td></tr>`).join("");
    document.querySelectorAll("th.s").forEach(t=>{t.classList.remove("asc","desc");if(t.dataset.s===sk)t.classList.add(dir>0?"asc":"desc")});
  };
  $("#pr").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;fr=b.dataset.r;$("#pr").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));draw()};
  $("#pe").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;fe=b.dataset.e;$("#pe").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));draw()};
  $("#lv").oninput=e=>{lv=+e.target.value;$("#lvv").textContent=lv;draw()};
  document.querySelectorAll("th.s").forEach(t=>t.onclick=()=>{const s=t.dataset.s;dir=(sk===s?-dir:(["r","el"].includes(s)?1:-1));sk=s;draw()});
  $("#pt").onclick=e=>{const tr=e.target.closest("tr");if(tr)petModal(tr.dataset.c,lv)};
  draw();
};
function petModal(cid, lv){
  const p = PETS.find(x=>x.cid===cid); lv = lv||1;
  const s = pstats(p,lv), s100 = pstats(p,100);
  const beats = BEATS[p.el], weak = Object.keys(BEATS).find(k=>BEATS[k]===p.el);
  const rate = p.r==="f"?RAR.f.w/RW/3:RAR[p.r].w/RW/5;
  $("#mbox").innerHTML = `<div class="mhead c-${p.r}"><div class="big">${pIcon(p)}</div><div><h3>${p.name}</h3><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${rp(p.r)} ${ep(p.el)}</div></div><button class="mx" onclick="closeM()">✕</button></div>

    <div class="kv"><div><small>HP · cấp ${lv}</small><b>${fmt(s.hp)}</b></div><div><small>ATK · cấp ${lv}</small><b>${fmt(s.atk)}</b></div><div><small>DEF · cấp ${lv}</small><b>${fmt(s.df)}</b></div><div><small>SPD · cấp ${lv}</small><b>${s.spd}</b></div></div>
    <div class="kv"><div><small>Cấp 100</small><b class="mono" style="font-size:14px">${fmt(s100.hp)} / ${fmt(s100.atk)} / ${fmt(s100.df)} / ${s100.spd}</b></div><div><small>Tỉ lệ gặp mỗi lần săn</small><b>${rate?pct(rate,1):"Không săn được"}</b></div>
    <div><small>Bán</small><b>${I("coin")} ${fmt(RAR[p.r].v)}</b></div><div><small>Hiến tế</small><b>${fmt(SAC[p.r])} Essence</b></div></div>

  </div>`;
  openM();
}

/* =====================================================================
   TÌM KIẾM
   ===================================================================== */
const plain = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"d").toLowerCase();
let IDX = [];
function buildIdx(){
  IDX = [];
  Object.entries(TITLES).forEach(([id,t])=>IDX.push({t:t.t,s:"Trang",ic:I(t.i),go:()=>location.hash=id}));
  CMDS.forEach(c=>IDX.push({t:cmdTxt(c.k),s:c.g,ic:I("quest"),x:c.d+" "+c.al.join(" "),go:()=>{sessionStorage.setItem("nsg_focus",c.k);location.hash="commands";route(true)}}));
  PETS.forEach(p=>IDX.push({t:p.name,s:RAR[p.r].n+" · "+EL[p.el].n,ic:pIcon(p),go:()=>{location.hash="pets";setTimeout(()=>petModal(p.cid,1),60)}}));
  Object.entries(WEAP).forEach(([k,w])=>IDX.push({t:w[1],s:"Vũ khí · "+ult(k,0)[0],ic:wIcon(k),x:ult(k,0)[0],go:()=>location.hash="weapons"}));
  MARKS.forEach(m=>IDX.push({t:m[2],s:"Ấn Ký",ic:ic(m[5],m[1]),x:m[3],go:()=>location.hash="marks"}));
  Object.values(GEMS).forEach(g=>IDX.push({t:g.n,s:"Ngọc",ic:ic(g.id.r,g.fb),go:()=>location.hash="gems"}));
  WBOSS.forEach(b=>IDX.push({t:b[0],s:"World Boss",ic:ic(b[3][0],b[8]),go:()=>location.hash="boss"}));
  TT.forEach(([g,ls])=>ls.forEach(t=>IDX.push({t:t[1],s:"Danh hiệu",ic:I(t[0]),go:()=>location.hash="profile"})));
  RAID_BOSS.forEach(b=>IDX.push({t:b[0],s:"Raid Boss",ic:eIcon(b[1]),go:()=>location.hash="raid"}));
  [...BLESS_PET,...BLESS_WPN].forEach(b=>IDX.push({t:b[1],s:"Blessing",ic:ic(b[4],b[5]),x:b[2],go:()=>location.hash="bless"}));
  COS.forEach(c=>IDX.push({t:c[1],s:c[0]==="bg"?"Hình nền":"Khung",ic:I("title"),go:()=>location.hash="cosmetics"}));
  FORMS.forEach(f=>IDX.push({t:f[1],s:"Bạch Hổ",ic:I("baiho"),go:()=>location.hash="beast"}));
  IDX.forEach(o=>o.k=plain(o.t+" "+(o.x||"")+" "+o.s));
}
let SEL = 0, HITS = [];
function doSearch(){
  const v = plain($("#q").value.trim().replace(/^[!/]/,""));
  const box = $("#sres");
  if(!v){box.classList.remove("on");return}
  HITS = IDX.map(o=>({o,sc:plain(o.t).startsWith(v)?3:plain(o.t).includes(v)?2:o.k.includes(v)?1:0})).filter(h=>h.sc).sort((a,b)=>b.sc-a.sc).slice(0,12).map(h=>h.o);
  SEL = 0;
  box.innerHTML = HITS.length ? HITS.map((h,i)=>`<a href="javascript:void 0" data-i="${i}" class="${i?"":"hl"}">${h.ic} <span>${h.t}</span><small>${h.s}</small></a>`).join("") : `<div class="none">Không tìm thấy “${$("#q").value}”</div>`;
  box.classList.add("on");
}
function pick(i){ const h=HITS[i]; if(!h)return; $("#sres").classList.remove("on"); $("#q").value=""; $("#q").blur(); h.go(); }

/* =====================================================================
   ĐỊNH TUYẾN
   ===================================================================== */
function route(force){
  const id = (location.hash||"#home").slice(1);
  const r = P[id] ? id : "home";
  $("#main").innerHTML = `<div class="fade">${P[r]()}${navbox()}</div>`;
  if(P[r].after) P[r].after();
  clearTimeout(window._icT);
  window._icT = setTimeout(()=>document.querySelectorAll("img.ei").forEach(i=>{ if(i.complete && !i.naturalWidth) F(i); }), 4000);
  document.querySelectorAll(".side a[data-r]").forEach(a=>a.classList.toggle("on",a.dataset.r===r));
  document.title = (r==="home"?"Nousagi Wiki · Bách khoa Nousagi Arena":TITLES[r].t+" · Nousagi Wiki");
  document.body.classList.remove("nav");
  if(!sessionStorage.getItem("nsg_focus")) window.scrollTo({top:0});
}

/* =====================================================================
   KHỞI ĐỘNG
   ===================================================================== */
buildSide(); buildIdx();
$("#inviteTop").href = invite();
if(CONFIG.INVITE_URL){ $("#inviteTop").target="_blank"; $("#inviteTop").rel="noopener"; }
else $("#inviteTop").onclick = e => { e.preventDefault(); toast("Chủ bot chưa dán link mời trong CONFIG"); };
$("#burger").onclick = () => document.body.classList.toggle("nav");
$("#scrim").onclick = () => document.body.classList.remove("nav");
$("#modal").onclick = e => { if(e.target.id==="modal") closeM(); };
$("#q").oninput = doSearch;
$("#q").onkeydown = e => {
  const as = $("#sres").querySelectorAll("a");
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!as.length)return; SEL=(SEL+(e.key==="ArrowDown"?1:-1)+as.length)%as.length; as.forEach((a,i)=>a.classList.toggle("hl",i===SEL)); as[SEL].scrollIntoView({block:"nearest"}); }
  else if(e.key==="Enter"){ e.preventDefault(); pick(SEL); }
  else if(e.key==="Escape"){ $("#sres").classList.remove("on"); }
};
$("#sres").onclick = e => { const a=e.target.closest("a[data-i]"); if(a) pick(+a.dataset.i); };
document.addEventListener("click", e => { if(!e.target.closest(".search")) $("#sres").classList.remove("on"); });
document.addEventListener("keydown", e => {
  if(e.key==="Escape") closeM();
  if(e.key==="/" && document.activeElement.tagName!=="INPUT"){ e.preventDefault(); $("#q").focus(); }
});
window.addEventListener("hashchange", () => route());
route();
